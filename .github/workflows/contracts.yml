name: Offline recovery contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd, pcntl, dom
          coverage: none
          tools: composer
      - name: Install declared dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          python3 -m venv /tmp/owr-ci-venv
          /tmp/owr-ci-venv/bin/pip install -r requirements-dev.txt
      - name: Independent M1 package contracts
        run: |
          find packages/markdown-m1/src -name '*.php' -exec php -l {} \;
          php -l packages/markdown-m1/ozeki-wordpress-resilience.php
          php packages/markdown-m1/tests/checkpoint.php packages/markdown-m1
          php packages/markdown-m1/tests/cleanup.php packages/markdown-m1
      - name: Verify contracts without private fixtures or cloud access
        run: |
          test ! -e .local
          /tmp/owr-ci-venv/bin/python -m unittest discover -s tests
          for test in tests/*.php; do php "$test"; done
          node tests/native-upload-async.js
      - name: Build development distributions
        run: |
          /tmp/owr-ci-venv/bin/python tools/build-release.py --output dist/candidate
          test -f dist/candidate/manifest.json
